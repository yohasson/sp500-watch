name: Improvement search
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/search.txt"]
permissions:
  contents: write
concurrency:
  group: search
  cancel-in-progress: true
jobs:
  exp:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices
            data/src
          key: prices-search-${{ github.run_id }}
          restore-keys: prices-
      - name: Run experiments
        run: |
          set -o pipefail
          { pip install -q -r requirements.txt && python -u tools/search.py; } 2>&1 | tee /tmp/search.log
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "sp500-oracle-bot"; git config user.email "sp500-oracle-bot@users.noreply.github.com"
          tail -c 20000 /tmp/search.log > data/search.log 2>/dev/null || true
          git add -f data/search.log; if [ -f data/search.json ]; then git add -f data/search.json; fi
          git commit -m "Search $(date -u +%FT%TZ)" || true
          for i in 1 2 3; do git pull --rebase --autostash -X ours origin main && git push origin HEAD:main && break; sleep 5; done
