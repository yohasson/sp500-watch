name: Source probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/probe.txt"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q yfinance && python -u tools/probe.py
      - name: Commit
        if: always()
        run: |
          git config user.name "sp500-oracle-bot"; git config user.email "sp500-oracle-bot@users.noreply.github.com"
          git add -f data/probe.json || true
          git commit -m "Probe $(date -u +%FT%TZ)" || true
          for i in 1 2 3; do git pull --rebase --autostash -X ours origin main && git push origin HEAD:main && break; sleep 5; done
