name: Oracle run
on:
  schedule:
    - cron: "23 21,22,23 * * 1-5"   # after the US close (off-peak minutes; GitHub may delay or drop top-of-hour schedules)
    - cron: "41 2,5,9,11,12,13 * * 1-5"  # retries before the US open (lock deadline 14:30 UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/run.txt"]
permissions:
  contents: write
  pages: write
concurrency:
  group: oracle
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Restore price cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/prices
            data/src
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Install and run the Oracle
        run: |
          set -o pipefail
          { pip install -q -r requirements.txt && python -u -m oracle run; } 2>&1 | tee /tmp/run.log
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Save price cache (also after a partial download)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            data/prices
            data/src
          key: prices-${{ github.run_id }}
      - name: Commit results to main
        run: |
          git config user.name "sp500-oracle-bot"
          git config user.email "sp500-oracle-bot@users.noreply.github.com"
          git add -A ledger site data
          git commit -m "Oracle run $(date -u +%FT%TZ)" || echo "no change"
          for i in 1 2 3; do git pull --rebase --autostash -X ours origin main && git push origin HEAD:main && break; sleep 5; done
      - name: Publish the site to gh-pages
        run: |
          rm -rf /tmp/site && cp -r site /tmp/site
          if git ls-remote --exit-code --heads origin gh-pages; then git fetch origin gh-pages && git checkout -B gh-pages origin/gh-pages; else git checkout --orphan gh-pages; git rm -rf -q . || true; fi
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +
          cp -r /tmp/site/. .
          git add -A && git commit -m "Site $(date -u +%FT%TZ)" || echo "no change"
          for i in 1 2 3; do git push origin gh-pages && break; sleep 5; done
          git checkout -f main
      - name: Make sure GitHub Pages serves gh-pages (best effort)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || true
      - name: Save the run log (also on failure)
        if: always()
        run: |
          git config user.name "sp500-oracle-bot"; git config user.email "sp500-oracle-bot@users.noreply.github.com"
          git checkout -f main 2>/dev/null || true
          mkdir -p data && (tail -c 20000 /tmp/run.log > data/last_run.log 2>/dev/null || echo "no log" > data/last_run.log)
          echo "status=${{ job.status }} run=${{ github.run_id }} utc=$(date -u +%FT%TZ)" >> data/last_run.log
          git add data/last_run.log && git commit -m "Run log $(date -u +%FT%TZ)" || true
          for i in 1 2 3; do git pull --rebase --autostash -X ours origin main && git push origin HEAD:main && break; sleep 5; done
