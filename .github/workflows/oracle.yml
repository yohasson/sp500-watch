name: Oracle run
on:
  schedule:
    - cron: "30 22 * * 1-5"   # after the US close (22:30 UTC): update prices, grade, seal on the last trading day of the week
    - cron: "15 11 * * 1"     # Monday backup, before the US open
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["oracle/**", "tools/run.txt", ".github/workflows/oracle.yml", "requirements.txt"]
permissions:
  contents: write
  pages: write
concurrency:
  group: oracle
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Run the Oracle
        run: python -m oracle run 2>&1 | tee run.log; test ${PIPESTATUS[0]} -eq 0
      - name: Commit results to main and publish the site to gh-pages
        run: |
          git config user.name "sp500-oracle-bot"
          git config user.email "sp500-oracle-bot@users.noreply.github.com"
          cp run.log data/last_run.log 2>/dev/null || true
          git add ledger site data/status.json data/universe.json data/last_run.log
          git commit -m "Oracle run $(date -u +%FT%TZ)" || echo "no change"
          for i in 1 2 3; do git pull --rebase -X ours origin main && git push origin HEAD:main && break; sleep 5; done
          rm -rf /tmp/site && cp -r site /tmp/site
          if git ls-remote --exit-code --heads origin gh-pages; then git fetch origin gh-pages && git checkout -B gh-pages origin/gh-pages; else git checkout --orphan gh-pages; git rm -rf . >/dev/null; fi
          find . -maxdepth 1 ! -name .git ! -name . -exec rm -rf {} +
          cp -r /tmp/site/. .
          git add -A && git commit -m "Site $(date -u +%FT%TZ)" || echo "no change"
          for i in 1 2 3; do git push origin gh-pages && break; sleep 5; done
      - name: Make sure GitHub Pages serves gh-pages (best effort)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages" -f "source[branch]=gh-pages" -f "source[path]=/" || true
      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: run-log, path: run.log }
